<!--
 * ============================================================
 * NAV — Composant générique UI
 * Design System : Élégant, sobre, professionnel
 * Dépendances   : tokens.css, nav.css, buttons.css, nav.js
 *
 * ÉTATS DOCUMENTÉS
 *   Défaut desktop : Logo gauche | Liens centre | Langue+CTA droite
 *   Défaut mobile  : Logo gauche | Hamburger droite
 *   Menu mobile ouvert : Overlay plein écran, hamburger → X
 *   Lien actif : .nav-link--active / aria-current="page"
 *   Focus      : Anneau visible sur chaque élément interactif
 *
 * ACCESSIBILITÉ
 *   - nav avec aria-label
 *   - Bouton hamburger : aria-expanded, aria-controls, aria-label
 *   - Menu mobile : id="nav-mobile-menu" pour aria-controls
 *   - Lien courant : aria-current="page"
 *   - Bouton langue : aria-label explicite
 *   - Fermeture menu à Echap (via nav.js)
 * ============================================================
-->

<!-- === IMPORT (dans la page hôte) ==========================
<link rel="stylesheet" href="/src/ui/tokens/tokens.css">
<link rel="stylesheet" href="/src/ui/components/buttons.css">
<link rel="stylesheet" href="/src/ui/components/nav.css">
<script src="/src/ui/components/nav.js" defer></script>
=========================================================== -->

<header role="banner">
  <nav class="nav" aria-label="Navigation principale">

    <div class="nav__inner">

      <!-- Logo -->
      <a href="/" class="nav-logo" aria-label="Accueil — Wilfried Langry">
        <span class="nav-logo__text" data-i18n="nav.logo">Wilfried Langry</span>
      </a>

      <!-- Navigation desktop : liens centrés -->
      <ul class="nav-links" role="list" aria-label="Liens de navigation">
        <li>
          <a href="/" class="nav-link nav-link--active" aria-current="page">Accueil</a>
        </li>
        <li>
          <a href="/a-propos" class="nav-link">À propos</a>
        </li>
        <li>
          <a href="/services" class="nav-link">Services</a>
        </li>
        <li>
          <a href="/realisations" class="nav-link">Réalisations</a>
        </li>
        <li>
          <a href="/blog" class="nav-link">Blog</a>
        </li>
        <li>
          <a href="/contact" class="nav-link">Contact</a>
        </li>
      </ul>

      <!-- Actions desktop : langue + CTA -->
      <div class="nav-actions" role="group" aria-label="Actions rapides">
        <!-- Switch langue -->
        <button
          type="button"
          class="nav-lang"
          aria-label="Switch to English"
          data-lang-toggle
        >
          EN
        </button>

        <!-- CTA principal -->
        <a href="/contact" class="btn btn-primary btn-sm">
          Prendre contact
        </a>
      </div>

      <!-- Bouton hamburger (mobile uniquement) -->
      <button
        type="button"
        class="nav-toggle"
        aria-label="Ouvrir le menu de navigation"
        aria-expanded="false"
        aria-controls="nav-mobile-menu"
        data-nav-toggle
      >
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="sr-only">Menu</span>
      </button>

    </div><!-- /.nav__inner -->

    <!-- Menu mobile overlay plein écran -->
    <div
      id="nav-mobile-menu"
      class="nav-mobile"
      aria-hidden="true"
      role="dialog"
      aria-label="Menu de navigation mobile"
    >
      <div role="group" aria-label="Menu mobile">

        <a href="/" class="nav-mobile__link nav-mobile__link--active" aria-current="page">
          Accueil
        </a>
        <a href="/a-propos" class="nav-mobile__link">À propos</a>
        <a href="/services" class="nav-mobile__link">Services</a>
        <a href="/realisations" class="nav-mobile__link">Réalisations</a>
        <a href="/blog" class="nav-mobile__link">Blog</a>
        <a href="/contact" class="nav-mobile__link">Contact</a>

        <!-- Actions mobile -->
        <div class="nav-mobile__actions">
          <button
            type="button"
            class="nav-lang"
            style="align-self:flex-start;"
            aria-label="Switch to English"
            data-lang-toggle
          >
            EN
          </button>
          <a href="/contact" class="btn btn-primary">
            Prendre contact
          </a>
        </div>

      </div>
    </div><!-- /#nav-mobile-menu -->

  </nav>
</header>

<!-- Classe utilitaire accessibilité (si non définie dans le CSS global) -->
<style>
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
