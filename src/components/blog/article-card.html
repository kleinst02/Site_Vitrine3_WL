<!-- Composant : Carte article (aperçu) -->
<article class="article-card card">
  <a href="/blog/{slug}" class="article-card__link" aria-label="Lire l'article : {title}">

    <!-- Image ou placeholder -->
    <div class="article-card__image">
      <img src="{image_url}" alt="" loading="lazy" class="article-card__img">
      <!-- Placeholder si pas d'image :
      <div class="article-card__placeholder" role="img" aria-label="Image à venir">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </div>
      -->
    </div>

    <!-- Contenu -->
    <div class="article-card__body">
      <div class="article-card__meta">
        <time class="article-card__date" datetime="{published_at}">{date_formatted}</time>
        <span class="badge badge-sm">{category}</span>
      </div>
      <h3 class="article-card__title">{title}</h3>
      <p class="article-card__excerpt">{excerpt}</p>
      <span class="article-card__read-more">Lire la suite &rarr;</span>
    </div>

  </a>
</article>
